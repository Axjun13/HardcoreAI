# SearXNG settings for HardcoreAI local search instance.
# Enables JSON output format so the Python backend can query the REST API.
# Mount this file at /etc/searxng/settings.yml inside the container.

use_default_settings: true

general:
  debug: false
  instance_name: "HardcoreAI Search"

search:
  # Enable the JSON output format so our backend can call /search?format=json
  formats:
    - html
    - json

server:
  # Secret key for HMAC-signed tokens — override in production.
  secret_key: "hardcoreai-searxng-secret-change-me"
  limiter: false
  image_proxy: false
  # Allow cross-origin requests from the backend (localhost)
  method: "GET"

ui:
  default_theme: simple
  default_locale: en

# Disable outgoing request proxying so requests go directly from the container.
outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
