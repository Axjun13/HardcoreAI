services:
  searxng:
    image: searxng/searxng:latest
    container_name: hardcoreai-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET_KEY=hardcoreai-searxng-secret-change-me
    networks:
      - hardcoreai-net

networks:
  hardcoreai-net:
    driver: bridge
